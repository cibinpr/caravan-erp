# ==============================================================================
# Caravan Accounting - Production Nginx Configuration (SRS Section 8.5)
# Place at: /etc/nginx/sites-available/caravan
# Symlink to: /etc/nginx/sites-enabled/caravan
# ==============================================================================

# Rate limiting zone for authentication endpoints (brute-force mitigation)
limit_req_zone $binary_remote_addr zone=caravan_login_limit:10m rate=5r/m;

# 1. HTTP Server Block (Redirect all plaintext traffic to HTTPS - DEP-3)
server {
    listen 80;
    listen [::]:80;
    server_name accounts.example.com staging-accounts.example.com;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accounts.example.com staging-accounts.example.com;

    # SSL Certificates (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/accounts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Web Root points to current symlink React SPA build (SRS Section 8.3 & 8.5)
    root /var/www/caravan/current/frontend/dist;
    index index.html;

    # Hide server versions (Section 8.5)
    server_tokens off;

    # File upload limit (Bill limit 5 MB + overhead = 6 MB)
    client_max_body_size 6M;

    # Security Headers (NFR-SEC-5 & Section 8.5)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none';" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Frontend SPA Routing (Section 8.5)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (1 year for hashed Vite chunks)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Do not cache index.html so releases update immediately for clients
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # --------------------------------------------------------------------------
    # PHP-FPM REST API Proxy (/api/ -> api/public/index.php)
    # --------------------------------------------------------------------------
    location /api/ {
        alias /var/www/caravan/current/api/public/;
        try_files $uri $uri/ @api_rewrite;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/caravan/current/api/public/index.php;
            fastcgi_param PHP_ADMIN_VALUE "open_basedir=/var/www/caravan/:/tmp/";
            
            # Auto-detect socket: php8.3-fpm, fallback php8.2-fpm
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            # Alternative: fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            
            fastcgi_intercept_errors on;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    location @api_rewrite {
        rewrite ^/api/(.*)$ /api/index.php last;
    }

    # Rate limiting on Login API (FR-AUTH-5 & Section 8.5)
    location = /api/v1/auth/login {
        limit_req zone=caravan_login_limit burst=3 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/caravan/current/api/public/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # --------------------------------------------------------------------------
    # Block Sensitive Files and Hidden Directories (NFR-SEC-6 & Section 8.5)
    # --------------------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|env|log|sh|md|git|bak|old|tmp)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /storage/ {
        deny all;
        return 404;
    }
}
