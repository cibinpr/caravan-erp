; ==============================================================================
; Caravan Accounting - Hardened PHP-FPM Production Settings (SRS Section 8.5)
; Copy to: /etc/php/8.3/fpm/conf.d/99-caravan-security.ini
; ==============================================================================

; Security & Information Leak Prevention
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; File Uploads (Section 8.5: 6 MB post and upload max)
upload_max_filesize = 6M
post_max_size = 6M
max_file_uploads = 5

; Resource Limits
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Sessions (FR-AUTH-3)
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_maxlifetime = 1800

; OPcache Performance Optimization (Section 8.5)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0
opcache.save_comments = 1
